# https://goreleaser.com  -  validate with `goreleaser check`
version: 2

project_name: starter

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: starter
    main: .
    binary: starter
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    # Reproducible builds: same commit in, same bytes out.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# .deb attached to the GitHub release. Deliberately not an APT repository:
# that needs GPG signing and hosting for very little gain over
# `curl -LO ... && sudo dpkg -i`.
nfpms:
  - id: deb
    package_name: starter
    formats: [deb]
    vendor: madeth1
    maintainer: madeth1 <alexstefan88@gmail.com>
    homepage: https://github.com/madeth1/starter-pack
    description: Scaffold projects from templates, with an arrow-key picker.
    license: MIT
    section: devel
    priority: optional
    # git is not optional: the catalog is fetched with it.
    dependencies:
      - git

scoops:
  - repository:
      owner: madeth1
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/madeth1/starter-pack
    description: Scaffold projects from templates, with an arrow-key picker.
    license: MIT

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: madeth1
    name: starter-pack
  footer: |
    ## Install

    ```sh
    scoop bucket add madeth1 https://github.com/madeth1/scoop-bucket && scoop install starter
    ```

    Debian/Ubuntu: download the `.deb` below and `sudo dpkg -i starter_*.deb`.

    macOS/Linux: download the archive for your platform below, or `go install
    github.com/madeth1/starter-pack@latest`.
