# https://goreleaser.com  -  validate with `goreleaser check`
version: 2

project_name: starter

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: starter
    main: .
    binary: starter
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    # Reproducible builds: same commit in, same bytes out.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# .deb attached to the GitHub release. Deliberately not an APT repository:
# that needs GPG signing and hosting for very little gain over
# `curl -LO ... && sudo dpkg -i`.
nfpms:
  - id: deb
    package_name: starter
    formats: [deb]
    vendor: madeth1
    maintainer: madeth1 <alexstefan88@gmail.com>
    homepage: https://github.com/madeth1/starter-pack
    description: Scaffold projects from templates, with an arrow-key picker.
    license: MIT
    section: devel
    priority: optional
    # git is not optional: the catalog is fetched with it.
    dependencies:
      - git

homebrew_casks:
  - name: starter
    repository:
      owner: madeth1
      name: homebrew-tap
      # GITHUB_TOKEN cannot push to another repo; see .github/workflows/release.yml
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    homepage: https://github.com/madeth1/starter-pack
    description: Scaffold projects from templates, with an arrow-key picker.
    license: MIT
    # Without the tap token the cask is still written to dist/, just not pushed,
    # so a release never fails over a missing secret.
    skip_upload: '{{ if envOrDefault "TAP_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'
    # The binaries are not code-signed, so strip the quarantine bit or macOS
    # refuses to run them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/starter"]
          end

scoops:
  - repository:
      owner: madeth1
      name: scoop-bucket
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    homepage: https://github.com/madeth1/starter-pack
    description: Scaffold projects from templates, with an arrow-key picker.
    license: MIT
    skip_upload: '{{ if envOrDefault "TAP_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: madeth1
    name: starter-pack
  footer: |
    ## Install

    ```sh
    brew install madeth1/tap/starter                    # macOS / Linux
    scoop bucket add madeth1 https://github.com/madeth1/scoop-bucket && scoop install starter
    ```

    Debian/Ubuntu: download the `.deb` below and `sudo dpkg -i starter_*.deb`.
